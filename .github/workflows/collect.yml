name: Collect MyHub feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: myhub-feed-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector-requirements.txt

      - name: Install collector dependencies
        run: pip install -r collector-requirements.txt

      - name: Collect and enrich feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MYHUB_SUMMARY_MODEL: gemini-3.5-flash-lite
          MYHUB_MAX_AI_ITEMS: "15"
        run: python collectors/rss.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/feed.json; then
            echo "No feed changes."
          else
            git config user.name "myhub-bot"
            git config user.email "myhub-bot@users.noreply.github.com"
            git add data/feed.json
            git commit -m "Update MyHub feed"
            git push
          fi

      - name: Upload feed directly to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          test -n "$PA_TOKEN" || (echo "Missing PYTHONANYWHERE_API_TOKEN secret" && exit 1)
          curl --fail --silent --show-error -X POST -H "Authorization: Token $PA_TOKEN" -F "content=@data/feed.json" "https://www.pythonanywhere.com/api/v0/user/MyHub/files/path/home/MyHub/MyHub/data/feed.json"

      - name: Deploy app files to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          upload () {
            local src="$1"
            local dst="$2"
            curl --fail --silent --show-error               -X POST               -H "Authorization: Token $PA_TOKEN"               -F "content=@$src"               "https://www.pythonanywhere.com/api/v0/user/MyHub/files/path/home/MyHub/MyHub/$dst"
          }

          upload "templates/index.html" "templates/index.html"
          upload "static/css/app.css" "static/css/app.css"
          upload "static/manifest.json" "static/manifest.json"
          upload "static/service-worker.js" "static/service-worker.js"
          upload "app.py" "app.py"

      - name: Reload PythonAnywhere web app
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error             -X POST             -H "Authorization: Token $PA_TOKEN"             "https://www.pythonanywhere.com/api/v0/user/MyHub/webapps/myhub.pythonanywhere.com/reload/"

      - name: Verify PythonAnywhere web app is reachable
        run: |
          curl --fail --silent --show-error "https://myhub.pythonanywhere.com/health"
