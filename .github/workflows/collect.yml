name: Collect MyHub feeds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collect.yml"
      - "app.py"
      - "feeds.py"
      - "collectors/**"
      - "templates/**"
      - "static/**"
      - "requirements.txt"
      - "collector-requirements.txt"
      - "data/game_watchlist.json"
      - "data/deal_keywords.json"
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: myhub-feed-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector-requirements.txt

      - name: Install collector dependencies
        run: pip install -r requirements.txt -r collector-requirements.txt

      - name: Test application and collector contracts
        run: python -m unittest discover -s tests -v

      - name: Collect and enrich feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GGDEALS_API_KEY: ${{ secrets.GGDEALS_API_KEY }}
          MYHUB_SUMMARY_MODEL: gemini-3.5-flash-lite
          MYHUB_MAX_AI_ITEMS: "15"
        run: python collectors/rss.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/feed.json && test -z "$(git ls-files --others --exclude-standard data/price_history.json)" && git diff --quiet -- data/price_history.json; then
            echo "No feed changes."
          else
            git config user.name "myhub-bot"
            git config user.email "myhub-bot@users.noreply.github.com"
            git add data/feed.json data/price_history.json
            git commit -m "Update MyHub feed"
            git push
          fi

      - name: Upload feed directly to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          test -n "$PA_TOKEN" || (echo "Missing PYTHONANYWHERE_API_TOKEN secret" && exit 1)
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors -X POST -H "Authorization: Token $PA_TOKEN" -F "content=@data/feed.json" "https://www.pythonanywhere.com/api/v0/user/MyHub/files/path/home/MyHub/MyHub/data/feed.json"

      - name: Deploy app files to PythonAnywhere
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          upload () {
            local src="$1"
            local dst="$2"
            curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors               -X POST               -H "Authorization: Token $PA_TOKEN"               -F "content=@$src"               "https://www.pythonanywhere.com/api/v0/user/MyHub/files/path/home/MyHub/MyHub/$dst"
          }

          while IFS= read -r -d '' path; do
            upload "$path" "$path"
          done < <(find templates static -type f -print0)
          upload "app.py" "app.py"
          upload "data/game_watchlist.json" "data/game_watchlist.json"
          upload "data/price_history.json" "data/price_history.json"

      - name: Reload PythonAnywhere web app
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors             -X POST             -H "Authorization: Token $PA_TOKEN"             "https://www.pythonanywhere.com/api/v0/user/MyHub/webapps/myhub.pythonanywhere.com/reload/"

      - name: Verify PythonAnywhere web app is reachable
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "https://myhub.pythonanywhere.com/health"
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "https://myhub.pythonanywhere.com/service-worker.js" -o /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --retry-all-errors "https://myhub.pythonanywhere.com/static/js/app.js" -o /dev/null

