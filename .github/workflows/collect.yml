name: Collect MyHub feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: myhub-feed-collector
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: collector-requirements.txt

      - name: Install collector dependencies
        run: pip install -r collector-requirements.txt

      - name: Collect feeds
        run: python collectors/rss.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/feed.json; then
            echo "No feed changes."
            exit 0
          fi

          git config user.name "myhub-bot"
          git config user.email "myhub-bot@users.noreply.github.com"
          git add data/feed.json
          git commit -m "Update MyHub feed"
          git push
