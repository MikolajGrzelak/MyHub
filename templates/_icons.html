{% macro icon(name, class='icon') -%}
<svg class="{{ class }}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'home' %}<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>
{% elif name == 'news' %}<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 7h8M8 11h8M8 15h3M8 18h8"/>
{% elif name == 'reddit' %}<path d="M18 10a3 3 0 0 1 3 3c0 4-4 7-9 7s-9-3-9-7a3 3 0 0 1 3-3M12 9l2-6 5 1"/><ellipse cx="12" cy="13" rx="7" ry="5"/><path d="M9 13h.01M15 13h.01M9 16q3 2 6 0"/><circle cx="20" cy="4" r="2"/>
{% elif name == 'youtube' %}<rect x="2" y="5" width="20" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/>
{% elif name == 'deal' %}<path d="M3 3h8l10 10-8 8L3 11Z"/><circle cx="7.5" cy="7.5" r="1"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>
{% elif name == 'bookmark' %}<path d="M6 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17l-6-4-6 4Z"/>
{% elif name == 'arrow' %}<path d="M7 17 17 7M7 7h10v10"/>
{% elif name == 'spark' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>
{% elif name == 'settings' %}<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--surface)"/><circle cx="15" cy="17" r="3" fill="var(--surface)"/>
{% elif name == 'refresh' %}<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 8a8 8 0 0 1 13-3l2 2M4 17l2 2a8 8 0 0 0 13-3"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% endif %}
</svg>
{%- endmacro %}
